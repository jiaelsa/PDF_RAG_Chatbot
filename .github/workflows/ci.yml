name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The tests use a fake embedder, so the heavy PyTorch install is not needed in CI.
      - run: pip install pypdf chromadb python-dotenv numpy openai streamlit pytest
      - run: python -m pytest
